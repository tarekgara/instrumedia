# Instrumedia library definition.
#
# This file is the single source of truth for the taxonomy, the perceptual
# traits used by the "Not sure" identifier, the confusion map, and which raw
# recordings become reference clips. `python tools/build.py` reads it and
# produces js/data.js plus the encoded audio in audio/.
#
# Trait vocabulary (keep in sync with `questions` below):
#   pitched:  yes | no
#   sustain:  held (keeps sounding while played) | decays (dies away on its own)
#   attack:   sharp | soft
#   tone:     breathy reedy brassy bowed twangy hammered metallic woody skin
#             noisy electronic buzzy pure
#   register: low | mid | high

sources:
  vcsl:
    name: Versilian Community Sample Library
    url: https://github.com/sgossner/VCSL
    license: CC0-1.0
    credit: Versilian Studios and contributors
  vsco:
    name: VSCO 2 Community Edition
    url: https://github.com/sgossner/VSCO-2-CE
    license: CC0-1.0
    credit: Versilian Studios
  freepats:
    name: FreePats
    url: https://freepats.zenvoid.org/
    license: per bank (see banks)
    credit: FreePats project and contributors
  commons:
    name: Wikimedia Commons
    url: https://commons.wikimedia.org/
    license: per file (CC0, public domain, CC BY or CC BY-SA)
    credit: Individual authors, credited per clip
  generated:
    name: Instrumedia synthesizer
    url: tools/synth.py
    license: CC0-1.0
    credit: Generated in code for this library

families:
  - id: bowed
    name: Bowed strings
    blurb: A bow drawn across strings. Smooth, singing, able to swell and hold.
  - id: plucked
    name: Plucked strings
    blurb: Strings set ringing by a finger or pick, then left to fade.
  - id: keys
    name: Keyboards
    blurb: Strings or electronics triggered from a keyboard. Chords are easy here.
  - id: organ
    name: Organs & free reeds
    blurb: Air through pipes or metal reeds. Notes hold as long as keys stay down.
  - id: woodwind
    name: Woodwinds
    blurb: Breath through a reed or across an edge. Airy to nasal.
  - id: brass
    name: Brass
    blurb: Lips buzzing into a metal tube. Bold, bright, warm when soft.
  - id: mallet
    name: Tuned percussion
    blurb: Bars, bells and tines struck or plucked at definite pitches.
  - id: drums
    name: Drums
    blurb: Struck skins and boxes. Thumps, cracks, booms.
  - id: metal
    name: Cymbals & small percussion
    blurb: Crashes, shimmers, rattles, clicks. Mostly no clear note.
  - id: electronic
    name: Electronic
    blurb: Synthesizers and drum machines. Waveforms, filters, envelopes.

questions:
  - id: pitched
    ask: Can you hum along with it?
    hint: A clear note you could sing back, or a hit, rattle or noise with no settled pitch.
    weight: 3
    options:
      - { value: "yes", label: "Yes, there's a note", example: flute/note-3 }
      - { value: "no", label: "No, it's a hit or noise", example: snare-drum/hit-1 }
  - id: tone
    ask: Which texture is closest?
    hint: Ignore pitch for a moment and listen to the grain of the sound.
    weight: 3
    options:
      - { value: breathy, label: "Airy, breathy", example: flute/note-3 }
      - { value: reedy, label: "Reedy, nasal", example: oboe/note-3 }
      - { value: brassy, label: "Brassy, blaring", example: trumpet/note-3 }
      - { value: bowed, label: "Bowed string", example: cello/note-3 }
      - { value: twangy, label: "Plucked string", example: acoustic-guitar-steel/note-3 }
      - { value: hammered, label: "Hammered, piano-like", example: grand-piano/note-3 }
      - { value: metallic, label: "Metallic, bell-like", example: glockenspiel/note-3 }
      - { value: woody, label: "Woody knock", example: marimba/note-3 }
      - { value: skin, label: "Drum skin", example: congas/hit-1 }
      - { value: noisy, label: "Hiss, wash or rattle", example: shaker/hit-1 }
      - { value: buzzy, label: "Buzzing, gritty", example: electric-guitar-distorted/note-3 }
      - { value: pure, label: "Pure, whistle-like", example: ocarina/note-3 }
      - { value: electronic, label: "Synthetic, electronic", example: synth-lead-saw/note-3 }
  - id: sustain
    ask: If a note is held, what happens?
    hint: Listen to the end of a long note. Does it hang at the same level, or fade by itself?
    weight: 2.5
    options:
      - { value: held, label: "It holds steady", example: clarinet/note-3 }
      - { value: decays, label: "It fades away", example: acoustic-guitar-nylon/note-3 }
  - id: attack
    ask: How does each note begin?
    hint: The first few milliseconds. A click or strike, or a swell from nothing.
    weight: 1.5
    options:
      - { value: sharp, label: "Instantly, with a click or strike", example: xylophone/note-3 }
      - { value: soft, label: "Softly, swelling in", example: synth-pad/note-3 }
  - id: register
    ask: Where does it sit?
    hint: Compare against these three references. Pick where most of the notes live.
    weight: 1.5
    options:
      - { value: low, label: "Low", example: tuba/note-2 }
      - { value: mid, label: "Middle", example: french-horn/note-4 }
      - { value: high, label: "High", example: piccolo/note-4 }

# ---------------------------------------------------------------------------
# Instruments
#
# samples.notes     one articulation sampled across the range (single notes,
#                   plus an assembled phrase, a busy-mix and a phone-speaker
#                   rendering). `count` notes are chosen spread across range.
# samples.variants  techniques, each rendered as one mid-range note
# samples.hits      unpitched: individual labelled hits, plus a groove pattern
# status: wanted    listed so the confusion map can point at it, no audio yet
# ---------------------------------------------------------------------------

instruments:

  # ---------------------------------------------------------------- bowed
  - id: violin
    name: Violin
    family: bowed
    sub: Violin family
    aliases: [fiddle]
    traits: { pitched: "yes", sustain: held, attack: [soft, sharp], tone: [bowed], register: [mid, high] }
    summary: The highest bowed string. Bright, singing, with a thin rosin edge when played hard.
    listen: ["A bright, focused line above the melody range of a voice", "Vibrato that wobbles the pitch slightly", "Bow noise and small scrapes on note starts"]
    confusions:
      - { id: viola, cue: "Viola is darker and huskier, rarely climbs into the violin's bright top register." }
      - { id: violin-section, cue: "A section blurs into a smooth sheen. One violin has a single clear vibrato and audible bow detail." }
      - { id: erhu, cue: "Erhu slides constantly between notes and has a nasal, hollow tone with no string-body warmth." }
      - { id: flute, cue: "Flute is airier with no bow grain. Violin notes carry a buzzy rosin texture." }
    samples:
      notes: { src: vsco, dir: Strings/Solo Violin/Arco Vib, prefer: [_f] }
      variants:
        - { label: Pizzicato (plucked), src: vsco, dir: Strings/Solo Violin/Pizz, prefer: [_f_] }
        - { label: Tremolo, src: vsco, dir: Strings/Solo Violin/Trem }
        - { label: Spiccato (bounced bow), src: vsco, dir: Strings/Solo Violin/spic, phrase: true }

  - id: violin-section
    name: Violin section
    family: bowed
    sub: String ensemble
    aliases: [strings, string section, orchestra strings]
    traits: { pitched: "yes", sustain: held, attack: [soft], tone: [bowed], register: [mid, high] }
    summary: Many violins in unison. Lush and smooth, the classic film-score string sound.
    listen: ["A wide, shimmering body with no single vibrato", "Softer bow detail than a solo violin", "Chorus-like thickness"]
    confusions:
      - { id: violin, cue: "Solo violin has one clear vibrato and exposed bow noise. The section is smoother and wider." }
      - { id: synth-pad, cue: "Synth strings and pads hold perfectly even. Real sections breathe, with bow changes and tiny pitch drift." }
      - { id: viola, cue: "Violas sit lower and sound darker, more covered." }
    samples:
      notes: { src: vsco, dir: Strings/Violin Section/susVib, prefer: [_v2] }
      variants:
        - { label: Pizzicato, src: vsco, dir: Strings/Violin Section/Pizz, prefer: [_v2] }
        - { label: Tremolo, src: vsco, dir: Strings/Violin Section/Trem, prefer: [_v2] }
        - { label: Spiccato, src: vsco, dir: Strings/Violin Section/Spic, phrase: true }

  - id: viola
    name: Viola
    family: bowed
    sub: Violin family
    traits: { pitched: "yes", sustain: held, attack: [soft, sharp], tone: [bowed], register: [mid] }
    summary: A slightly larger violin, tuned a fifth lower. Warm, husky, a little veiled.
    listen: ["Middle-register bowed tone, darker than violin", "A covered, nasal-husky color on the low strings"]
    note: These recordings are a viola section. A solo viola sounds more focused, with clearer bow detail.
    confusions:
      - { id: violin, cue: "Violin is brighter and sits higher. Viola sounds as if a blanket were draped over a violin." }
      - { id: cello, cue: "Cello goes much deeper and has a rounder, chestier resonance." }
    samples:
      notes: { src: vsco, dir: Strings/Viola Section/susvib, prefer: [_v2] }
      variants:
        - { label: Pizzicato, src: vsco, dir: Strings/Viola Section/pizz, prefer: [_v2] }
        - { label: Tremolo, src: vsco, dir: Strings/Viola Section/trem }
        - { label: Spiccato, src: vsco, dir: Strings/Viola Section/spic, phrase: true }

  - id: cello
    name: Cello
    family: bowed
    sub: Violin family
    aliases: [violoncello]
    traits: { pitched: "yes", sustain: held, attack: [soft, sharp], tone: [bowed], register: [low, mid] }
    summary: Deep and vocal. Spans the range of a male voice and sings like one.
    listen: ["Rich low bowed notes with a woody resonance", "Expressive vibrato in the tenor range"]
    note: These recordings are a cello section.
    confusions:
      - { id: double-bass, cue: "Double bass is an octave lower and gruffer. Cello's low notes still have a singing core." }
      - { id: viola, cue: "Viola cannot reach cello's deep register and sounds thinner." }
      - { id: bassoon, cue: "Bassoon is reedy with a dry buzz. Cello has bow grain and a resonant wooden body." }
      - { id: french-horn, cue: "Horn is round and brassy-soft with no bow texture." }
    samples:
      notes: { src: vsco, dir: Strings/Cello Section/susvib, prefer: [_v2] }
      variants:
        - { label: Pizzicato, src: vsco, dir: Strings/Cello Section/pizzT, prefer: [_v2] }
        - { label: Tremolo, src: vsco, dir: Strings/Cello Section/trem }
        - { label: Spiccato, src: vsco, dir: Strings/Cello Section/spic, phrase: true }

  - id: double-bass
    name: Double bass
    family: bowed
    sub: Violin family
    aliases: [upright bass, contrabass, acoustic bass, string bass]
    traits: { pitched: "yes", sustain: [held, decays], attack: [soft, sharp], tone: [bowed, twangy], register: [low] }
    summary: The lowest bowed string. Bowed in orchestras, plucked in jazz as the walking bass.
    listen: ["Very low notes with a grainy bow rasp", "Plucked: a woody, thumpy note that blooms then fades"]
    confusions:
      - { id: electric-bass, cue: "Plucked upright bass is woodier and thumpier with a quick bloom. Electric bass sustains longer and sounds smoother, more even." }
      - { id: cello, cue: "Cello sits an octave higher and sounds more vocal." }
      - { id: tuba, cue: "Tuba is a smooth brass tone with no bow grit." }
      - { id: synth-bass, cue: "Synth bass is perfectly even and often filtered. Upright bass has wood and finger noise." }
    samples:
      notes: { src: vsco, dir: Strings/Solo Contrabass/SusVib, prefer: [_v2] }
      variants:
        - { label: Pizzicato (jazz-style pluck), src: vsco, dir: Strings/Solo Contrabass/Pizz, prefer: [_v2], phrase: true }
        - { label: Non-vibrato, src: vsco, dir: Strings/Solo Contrabass/SusNV, prefer: [_v2] }
        - { label: Tremolo, src: vsco, dir: Strings/Solo Contrabass/Trem }

  - id: erhu
    name: Erhu
    family: bowed
    sub: Spike fiddle
    traits: { pitched: "yes", sustain: held, attack: [soft], tone: [bowed, reedy], register: [mid, high] }
    summary: Chinese two-string fiddle. Nasal, plaintive, constantly sliding between notes.
    listen: ["Frequent slides and bends", "A hollow nasal tone, almost vocal"]
    confusions:
      - { id: violin, cue: "Violin is fuller and more resonant. Erhu is thinner and slides much more." }

  # ---------------------------------------------------------------- plucked
    samples:
      excerpts:
        - { file: "File:江河水.ogg", label: "“River” (Jiang He Shui)", dur: 10 }
        - { file: "File:二泉映月.ogg", label: "“The Moon Reflected on Erquan”", dur: 10 }

  - id: acoustic-guitar-nylon
    name: Classical guitar
    family: plucked
    sub: Guitar
    aliases: [nylon-string guitar, spanish guitar, acoustic guitar]
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [twangy], register: [low, mid] }
    summary: Nylon strings. Round, soft-edged and warm, the sound of flamenco and bossa nova.
    listen: ["Mellow plucked notes with a rounded attack", "Less shimmer and jangle than steel strings"]
    confusions:
      - { id: acoustic-guitar-steel, cue: "Steel strings are brighter and jangly, with a metallic shimmer. Nylon is rounder and softer." }
      - { id: harp, cue: "Harp notes ring longer and cleaner with a bell-like bloom. Guitar has more finger and body sound." }
      - { id: ukulele, cue: "Ukulele is smaller and higher, with a short, boxy plink." }
      - { id: electric-guitar-clean, cue: "Clean electric is smoother and sustains more evenly, with no wooden body resonance." }
    samples:
      notes: { src: freepats, bank: SpanishClassicalGuitar, phrase: true }

  - id: acoustic-guitar-steel
    name: Steel-string acoustic guitar
    family: plucked
    sub: Guitar
    aliases: [acoustic guitar, folk guitar, western guitar, dreadnought]
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [twangy], register: [low, mid] }
    summary: The singer-songwriter guitar. Bright, jangly, shimmering overtones.
    listen: ["Crisp metallic sparkle on each note", "Strummed chords with a bright wash"]
    confusions:
      - { id: acoustic-guitar-nylon, cue: "Nylon is warmer and rounder with less sparkle." }
      - { id: electric-guitar-clean, cue: "Clean electric lacks the woody body boom and sounds smoother." }
      - { id: mandolin, cue: "Mandolin is higher and thinner, often tremolo-picked on doubled strings." }
      - { id: banjo, cue: "Banjo is twangier and dies away fast with a papery snap." }
      - { id: harpsichord, cue: "Harpsichord is also plucked but brassier, with a hard quill snap and no bends." }
    samples:
      notes: { src: freepats, bank: FSS-SteelStringGuitar, sfz: FSS-SteelStringGuitar, phrase: true }

  - id: electric-guitar-clean
    name: Electric guitar (clean)
    family: plucked
    sub: Guitar
    aliases: [clean guitar, jazz guitar, strat, telecaster]
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [twangy], register: [low, mid] }
    summary: Amplified with no distortion. Glassy, smooth, even sustain.
    listen: ["A smooth, even decay without acoustic body boom", "A slightly glassy or quacky edge depending on pickup"]
    confusions:
      - { id: acoustic-guitar-steel, cue: "Acoustic guitars have a woody body resonance and more string noise." }
      - { id: electric-guitar-distorted, cue: "Distortion adds grit, compression and endless sustain." }
      - { id: rhodes, cue: "Electric piano is bell-like and rounder, with no pick attack." }
      - { id: harp, cue: "Harp has no amp color and blooms more." }
    samples:
      notes: { src: freepats, bank: EGuitarFSBS-clean-bridge-small, phrase: true }

  - id: electric-guitar-distorted
    name: Electric guitar (distorted)
    family: plucked
    sub: Guitar
    aliases: [overdrive, rock guitar, metal guitar, fuzz guitar]
    traits: { pitched: "yes", sustain: held, attack: [sharp], tone: [buzzy, twangy], register: [low, mid] }
    summary: Driven through overdrive or fuzz. Gritty, compressed, sustaining.
    listen: ["A buzzing, saturated edge on every note", "Notes that sustain far longer than a clean guitar"]
    confusions:
      - { id: synth-lead-saw, cue: "Saw leads are perfectly steady. Distorted guitar has pick attack, string bends and feedback wobble." }
      - { id: electric-guitar-clean, cue: "No grit or crunch means clean." }
      - { id: bagpipe, cue: "Bagpipe has a constant drone underneath and no pick attacks." }
    samples:
      notes: { src: freepats, bank: EGuitarFSBS-dist1, phrase: true }

  - id: electric-bass
    name: Electric bass
    family: plucked
    sub: Bass
    aliases: [bass guitar, fender bass, finger bass]
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [twangy], register: [low] }
    summary: The foundation of most pop, rock and funk. Round, punchy, smooth sustain.
    listen: ["Low notes with a clear finger or pick attack", "An even, smooth decay"]
    confusions:
      - { id: double-bass, cue: "Upright bass is woodier and more percussive, and fades sooner. Electric bass holds a smoother tone." }
      - { id: synth-bass, cue: "Synth bass is even, often with filter sweeps and no finger noise." }
      - { id: sub-808, cue: "808 bass is a pure sine boom with a pitch drop at the start." }
      - { id: tuba, cue: "Tuba is breathy-brassy and swells. Bass guitar is plucked." }
    samples:
      notes: { src: freepats, bank: FingerBassYR, phrase: true }

  - id: ukulele
    name: Ukulele
    family: plucked
    sub: Guitar
    aliases: [uke]
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [twangy], register: [mid, high] }
    summary: Four nylon strings on a tiny body. Short, bright plinks.
    listen: ["Short, boxy plucks with fast decay", "A high, sweet register with no bass strings"]
    confusions:
      - { id: acoustic-guitar-nylon, cue: "Classical guitar reaches much lower and rings longer." }
      - { id: mandolin, cue: "Mandolin has metal strings: brighter, thinner, often tremolo-picked." }
    samples:
      notes: { src: freepats, bank: Ukulele, phrase: true }

  - id: harp
    name: Harp
    family: plucked
    sub: Harp
    aliases: [concert harp, pedal harp]
    traits: { pitched: "yes", sustain: decays, attack: [sharp, soft], tone: [twangy], register: [low, mid, high] }
    summary: Dozens of open strings. Clear, ringing, bell-like plucks and sweeping glissandos.
    listen: ["Pure, round plucks that ring freely", "Sweeping runs up and down the strings"]
    confusions:
      - { id: acoustic-guitar-nylon, cue: "Guitar has a boxier, drier sound with fret noise. Harp rings open and bell-like." }
      - { id: celesta, cue: "Celesta is a metallic bell tone, not a string." }
      - { id: dan-tranh, cue: "Zither is brighter, metallic, and often bent in pitch." }
      - { id: kalimba, cue: "Kalimba has a metallic tine buzz and short sustain." }
    samples:
      notes: { src: vcsl, dir: Chordophones/Composite Chordophones/Concert Harp, prefer: [_f], phrase: true }
      variants:
        - { label: Folk harp (lever harp), src: vcsl, dir: Chordophones/Composite Chordophones/Folk Harp, prefer: [_v3_] }

  - id: dan-tranh
    name: Zither (đàn tranh)
    family: plucked
    sub: Zither
    aliases: [dan tranh, guzheng, koto, zither]
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [twangy, metallic], register: [mid, high] }
    summary: Vietnamese long zither, close cousin of the guzheng and koto. Bright metallic plucks, bends and vibrato.
    listen: ["Bright twangy plucks with pitch bends after the attack", "Tremolo and cascading glissandos"]
    confusions:
      - { id: harp, cue: "Harp is rounder and never bends a note after plucking." }
      - { id: sitar, cue: "Sitar has a buzzing jawari tone and sympathetic string halo." }
    samples:
      notes: { src: vcsl, dir: Chordophones/Zithers/Dan Tranh/Normal, prefer: [_f_], phrase: true }
      variants:
        - { label: Vibrato (pressed bends), src: vcsl, dir: Chordophones/Zithers/Dan Tranh/Vibrato, prefer: [_ff_] }
        - { label: Tremolo, src: vcsl, dir: Chordophones/Zithers/Dan Tranh/Tremolo }

  - id: jaw-harp
    name: Jaw harp
    family: plucked
    sub: Lamellophone
    aliases: [jew's harp, mouth harp, trump]
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [buzzy, metallic], register: [low, mid] }
    summary: A metal tongue plucked in front of the mouth. A twanging "boing" shaped by the mouth.
    listen: ["A buzzing drone whose overtones wah around", "A boingy, cartoonish twang"]
    confusions:
      - { id: didgeridoo, cue: "Didgeridoo is blown and continuous. Jaw harp is plucked in rhythmic twangs." }
    samples:
      notes: { src: freepats, bank: JawHarp, count: 3 }

  - id: mandolin
    name: Mandolin
    family: plucked
    sub: Lute
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [twangy, metallic], register: [mid, high] }
    summary: Paired steel strings, bright and short. Long notes are played as fast tremolo picking.
    listen: ["Rapid tremolo on sustained notes", "A bright, thin, chiming tone"]
    confusions:
      - { id: acoustic-guitar-steel, cue: "Guitar is lower and fuller." }
      - { id: banjo, cue: "Banjo is twangier, with a drum-head snap." }
    samples:
      excerpts:
        - { file: "File:Schneewalzer.ogg", label: "Waltz (concert mandolin)", dur: 8 }

  - id: banjo
    name: Banjo
    family: plucked
    sub: Lute
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [twangy], register: [mid, high] }
    summary: Strings over a drum head. Bright, twangy, quick decay, rolling fingerpicked patterns.
    listen: ["A papery snap and fast decay", "Rolling repeated patterns"]
    confusions:
      - { id: acoustic-guitar-steel, cue: "Guitar sustains longer with a woody body." }
    samples:
      excerpts:
        - { file: "File:Banjo.ogg", label: "Picking", dur: 10 }

  - id: sitar
    name: Sitar
    family: plucked
    sub: Lute
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [twangy, buzzy], register: [mid] }
    summary: North Indian long-necked lute. Buzzing bridge, sympathetic strings, sliding notes.
    listen: ["A buzzing, sizzling halo around each note", "Deep pitch bends and a shimmering drone"]
    confusions:
      - { id: dan-tranh, cue: "Zither is cleaner, without the sizzling buzz." }

  # ---------------------------------------------------------------- keys
    samples:
      excerpts:
        - { file: "File:Sitar sample yaman.ogg", label: "Raag Yaman", dur: 10 }
        - { file: "File:Sitar clipping.ogg", label: "Phrase", dur: 8 }

  - id: grand-piano
    name: Grand piano
    family: keys
    sub: Piano
    aliases: [piano, acoustic piano, concert grand]
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [hammered], register: [low, mid, high] }
    summary: Felt hammers striking steel strings. Huge range, rich resonance, long decay.
    listen: ["A soft thud of hammer then a ringing, complex tone", "Chords, and deep bass notes with long tails"]
    confusions:
      - { id: upright-piano, cue: "Upright is boxier and a little honkier, with less bass bloom." }
      - { id: fm-electric-piano, cue: "Electric pianos are smoother and bell-like, with no hammer thud or string shimmer." }
      - { id: harpsichord, cue: "Harpsichord plucks: jangly, bright and without dynamics." }
      - { id: vibraphone, cue: "Vibraphone is a pure metallic tone, often with a wobble." }
    samples:
      notes: { src: vcsl, dir: "Chordophones/Zithers/Grand Piano, Steinway B/Sus", prefer: [_vl3_], phrase: true }
      variants:
        - { label: Soft touch, src: vcsl, dir: "Chordophones/Zithers/Grand Piano, Steinway B/Sus", prefer: [_vl1_] }
        - { label: Dampened (no pedal), src: vcsl, dir: "Chordophones/Zithers/Grand Piano, Steinway B/NoSus", prefer: [_vl3_] }

  - id: upright-piano
    name: Upright piano
    family: keys
    sub: Piano
    aliases: [piano, home piano, bar piano]
    traits: { pitched: "yes", sustain: decays, attack: [sharp], tone: [hammered], register: [low, mid, high] }
    summary: The vertical home piano. Boxier and more intimate than a grand, sometimes a little out of tune.
    listen: ["A drier, more mid-heavy piano", "Mechanical key and pedal noise up close"]
    confusions:
      - { id: grand-piano, cue: "Grand has a deeper bass and longer, richer sustain." }
